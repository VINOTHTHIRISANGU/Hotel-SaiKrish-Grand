<svg
  width="100%"
  height="auto"
  viewBox="0 0 1024 180"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet"
>
  <style>
    .letter {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 130px;
      font-weight: 900;
      dominant-baseline: middle;
    }

    .red {
      fill: #d71920;
    }

    .green {
      fill: #078b3d;
    }

    .dance {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: dance 1s ease-in-out infinite;
    }

    @keyframes dance {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-15px) rotate(-5deg);
      }

      50% {
        transform: translateY(0) rotate(5deg);
      }

      75% {
        transform: translateY(-10px) rotate(-3deg);
      }
    }

    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: 0.08s; }
    .d3 { animation-delay: 0.16s; }
    .d4 { animation-delay: 0.24s; }
    .d5 { animation-delay: 0.32s; }
    .d6 { animation-delay: 0.40s; }
    .d7 { animation-delay: 0.48s; }
    .d8 { animation-delay: 0.56s; }
    .d9 { animation-delay: 0.64s; }
    .d10 { animation-delay: 0.72s; }
    .d11 { animation-delay: 0.80s; }
    .d12 { animation-delay: 0.88s; }
  </style>

  <!-- SAIKRISH -->
  <text x="20"  y="100" class="letter red dance d1">S</text>
  <text x="105" y="100" class="letter red dance d2">A</text>
  <text x="190" y="100" class="letter red dance d3">I</text>
  <text x="225" y="100" class="letter red dance d4">K</text>
  <text x="305" y="100" class="letter red dance d5">R</text>
  <text x="390" y="100" class="letter red dance d6">I</text>
  <text x="425" y="100" class="letter red dance d7">S</text>
  <text x="505" y="100" class="letter red dance d8">H</text>

  <!-- GRAND -->
  <text x="600" y="100" class="letter green dance d5">G</text>
  <text x="690" y="100" class="letter green dance d6">R</text>
  <text x="775" y="100" class="letter green dance d7">A</text>
  <text x="860" y="100" class="letter green dance d8">N</text>
  <text x="945" y="100" class="letter green dance d9">D</text>
</svg>
